/* ===== QuestiFamille V5.1 — jeu familial doux ===== */
:root{
  --surface:#ffffff;
  --surface-2:#f8f8fc;
  --surface-3:#f2f0ff;
  --orange:#ea7a16;
  --orange-bg:#fff4e8;
  --green-bg:#eefbf2;
  --danger-bg:#fff2f2;
  --radius:18px;
  --radius-sm:13px;
  --soft-shadow:0 5px 18px rgba(31,35,72,.055);
}
body{background:var(--bg);transition:background .2s,color .2s}
header{background:var(--surface);color:var(--text);padding:17px 18px;border-bottom:1px solid var(--line);box-shadow:none}
header:after{display:none}
header h1{font-size:24px;color:var(--p)}
header p{color:var(--muted);font-size:13px;margin-top:2px}
.bell{background:var(--surface-2);color:var(--text);border:1px solid var(--line);box-shadow:none;top:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--soft-shadow);backdrop-filter:none}
button{background:var(--p);box-shadow:none;border-radius:12px}
button.ok{background:var(--ok)}
button.bad{background:var(--bad)}
button.gold{background:var(--orange)}
button.ghost{background:var(--surface-3);color:var(--p);border-color:#ddd8ff}
button.soft{background:var(--surface-2);color:var(--text)}
input,textarea,select{background:var(--surface-2);color:var(--text);border-color:var(--line);border-radius:12px}
input:focus,textarea:focus,select:focus{background:var(--surface);box-shadow:0 0 0 3px rgba(91,76,240,.12)}
.field{display:grid;gap:5px;margin:9px 0}
.field>label{font-size:13px;font-weight:780;color:var(--text)}
.field input,.field textarea,.field select{margin:0}
.hero{background:var(--surface-3);border-color:#e2ddff;border-radius:16px;padding:15px}
.stats.compact{grid-template-columns:repeat(4,1fr)}
.stats.compact .stat{padding:10px;border-radius:13px;background:var(--surface-2);border-color:var(--line)}
.stats.compact .stat b{font-size:20px}
.next-quest{border:1px solid #ddd8ff;background:var(--surface-3);border-radius:18px;padding:17px;margin:12px 0}
.next-quest-head{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.quest-icon,.shop-emoji{display:grid;place-items:center;width:48px;height:48px;border-radius:15px;background:var(--surface);font-size:25px;flex:0 0 auto;border:1px solid var(--line)}
.next-quest h3{margin:0 0 3px;font-size:20px}
.next-quest .primary-action{width:100%;font-size:16px;margin-top:12px}
.due{display:inline-flex;align-items:center;gap:4px;color:var(--muted);font-size:13px;font-weight:650}
.quest-card-head,.shop-card-head{display:flex;align-items:flex-start;gap:12px}
.quest-card-main,.shop-card-main{min-width:0;flex:1}
.quest-title,.shop-title{font-size:17px;font-weight:820;line-height:1.25}
.quest-meta,.shop-meta{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:5px}
.quest{padding:15px;border-radius:16px;box-shadow:none;background:var(--surface)}
.quest:before{width:3px;background:var(--p)}
.quest-details{margin:10px 0 0;border-top:1px solid var(--line);padding-top:8px}
.quest-details summary{cursor:pointer;color:var(--p);font-weight:700;font-size:13px}
.quest-details p{margin:8px 0}
.more-menu{margin-top:9px}
.more-menu summary{cursor:pointer;display:inline-flex;align-items:center;gap:4px;padding:8px 11px;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;font-weight:800;color:var(--text);list-style:none}
.more-menu summary::-webkit-details-marker{display:none}
.more-menu .menu-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:8px}
.more-menu .menu-actions button{min-width:0;font-size:12px;padding:9px 7px}
.st-failed{background:var(--orange-bg);color:#b45309}
.goal{background:var(--surface-3);border-color:#ddd8ff;border-radius:17px}
.progress{height:10px;background:#e9e9f1}
.progress>span{background:var(--p);transition:width .35s ease}
.shopgrid{gap:12px}
.shopitem{padding:15px;border-radius:17px;box-shadow:none;background:var(--surface);position:relative}
.shopitem.is-goal{border:2px solid var(--p);background:var(--surface-3)}
.goal-ribbon{position:absolute;right:11px;top:10px;background:var(--p);color:#fff;border-radius:999px;padding:5px 8px;font-size:11px;font-weight:800}
.missing{font-size:13px;color:var(--orange);font-weight:750}
.have-enough{font-size:13px;color:var(--ok);font-weight:750}
.parent-priority{border:1px solid #ffe0bd;background:var(--orange-bg);border-radius:17px;padding:14px;margin:12px 0}
.validation-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:8px}
.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:18px 0 8px}
.section-title h3{margin:0}
.child-card,.mini,.member,.redeem,.recurring,.hist{background:var(--surface);box-shadow:none}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.achievement{display:inline-flex;align-items:center;gap:6px;background:var(--surface-3);border:1px solid #ddd8ff;color:var(--text);border-radius:999px;padding:7px 10px;font-size:12px;font-weight:800}
.pref-grid{display:grid;gap:9px;margin-top:14px}
.pref-row{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--surface-2);border:1px solid var(--line);padding:11px;border-radius:13px}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(15px);background:#1f2433;color:white;padding:11px 14px;border-radius:12px;z-index:9999;box-shadow:0 10px 30px rgba(0,0,0,.18);opacity:0;transition:.2s;max-width:min(90vw,440px);text-align:center;font-weight:700}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
[data-theme="dark"]{
  --bg:#11131a;--text:#f4f5fb;--muted:#a9afc1;--line:#2b2f3c;
  --card:#191c25;--surface:#191c25;--surface-2:#20242f;--surface-3:#27233d;
  --orange-bg:#2b2117;--green-bg:#16271b;--danger-bg:#2a181b;
  --shadow:none;--soft-shadow:none;
}
[data-theme="dark"] body{background:#11131a}
[data-theme="dark"] .badge{background:#2c2943;color:#cbc5ff}
[data-theme="dark"] .notice{background:#282315;border-color:#544721}
[data-theme="dark"] .danger-zone{background:#2a1b1d;border-color:#5a292e}
[data-theme="dark"] .parent-priority{background:#2b2117;border-color:#5a4529;color:var(--text)}
[data-theme="dark"] .parent-priority .section-title h3{color:var(--text)}
[data-theme="dark"] .parent-priority .badge{background:#3a2e21;color:#f4f5fb}
[data-theme="dark"] .share-card{background:#20243a;border-color:#333951}
[data-theme="dark"] .tabs button{background:transparent;color:#c7cada}
[data-theme="dark"] .tabs .active{background:var(--p);color:white}
[data-theme="dark"] .link{background:#20242f;border-color:#2b2f3c}
.reduce-motion *, .reduce-motion *::before, .reduce-motion *::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
@media(max-width:620px){
  .stats.compact{grid-template-columns:repeat(2,1fr)}
  .more-menu .menu-actions{grid-template-columns:1fr}
  .tabs{background:var(--surface);border-color:var(--line);box-shadow:0 -5px 20px rgba(20,23,40,.08)}
  header{position:sticky;top:0;z-index:6}
}


/* ===== V5.2 — personnalisation profil / badges ===== */
.profile-hero{border-left:4px solid var(--profile-color,#6d5df0)}
.hero-person{display:flex;align-items:center;gap:13px}
.hero-person h2{margin:0 0 4px}
.hero-person p{margin:0}
.profile-avatar{
  display:grid;place-items:center;width:54px;height:54px;border-radius:17px;
  background:var(--surface);font-size:30px;border:2px solid var(--profile-color,#6d5df0);
  box-shadow:0 0 0 4px var(--profile-soft,#ece9ff);flex:0 0 auto
}
.hero-note{margin:11px 0 0!important;font-size:13px;color:var(--muted)}
.hero-badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}
.hero-badge{
  display:inline-flex;align-items:center;gap:5px;border-radius:999px;
  padding:6px 9px;background:var(--surface);border:1px solid var(--line);
  font-size:11px;font-weight:800
}
.avatar-picker,.color-picker{display:flex;gap:9px;flex-wrap:wrap;margin:9px 0 14px}
.avatar-choice{
  width:48px;height:48px;padding:0;min-height:48px;border-radius:15px;
  font-size:25px;background:var(--surface-2);color:var(--text);
  border:1px solid var(--line);box-shadow:none
}
.avatar-choice.selected{outline:3px solid var(--p);background:var(--surface-3)}
.color-choice{
  width:40px;height:40px;min-height:40px;border-radius:999px;padding:0;
  border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line)
}
.color-choice.selected{outline:3px solid var(--text);outline-offset:2px}
.profile-preview{
  display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--line);
  border-left:4px solid var(--profile-color,#6d5df0);border-radius:15px;
  background:var(--surface-2);margin:8px 0 16px
}
.profile-preview-avatar{
  display:grid;place-items:center;width:50px;height:50px;border-radius:15px;
  font-size:27px;background:var(--surface);
  border:2px solid var(--profile-color,#6d5df0);
  box-shadow:0 0 0 4px var(--profile-soft,#ece9ff)
}
.badge-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin:10px 0 16px}
.badge-card{
  border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--surface);
  min-height:92px
}
.badge-card.unlocked{border-color:#d9d3ff;background:var(--surface-3)}
.badge-card.locked{opacity:.58;filter:saturate(.55)}
.badge-icon{font-size:23px;margin-bottom:6px}
.badge-card b{display:block;font-size:13px}
.badge-card small{display:block;margin-top:4px}
.member-accent{border-left:4px solid var(--member-color,#6d5df0)}
.child-card.member-accent,.member.member-accent{padding-left:12px}
.profile-chip{
  display:inline-flex;align-items:center;gap:5px;padding:5px 8px;border-radius:999px;
  background:var(--surface-2);border:1px solid var(--line);font-size:11px;font-weight:800
}
@media(max-width:620px){
  .badge-grid{grid-template-columns:1fr}
  .profile-avatar{width:50px;height:50px;font-size:27px}
}

function achievementsForMe(){

    const reg=await navigator.serviceWorker.register("/sw.js");await navigator.serviceWorker.ready;
    let sub=await reg.pushManager.getSubscription();
    if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64ToUint8Array(state.vapid_public_key)});
    const j=sub.toJSON();await api("save_push_subscription",{subscription:{endpoint:sub.endpoint,keys:j.keys}});
    alert("Notifications push activées 👍");
  }catch(e){alert("Impossible d’activer les notifications : "+e.message)}
}

$("bell").onclick=async()=>{current="home";show("home");$("home").insertAdjacentHTML("afterbegin",'<h3>🔔 Notifications</h3>'+state.notifications.map(n=>`<div class="note ${n.read_at?"":"unread"}"><b>${esc(n.title)}</b><p>${esc(n.message)}</p><small>${fmt(n.created_at)}</small></div>`).join(""));try{await api("mark_notifications_read");$("bellCount").textContent="0"}catch{}};
async function load(force=false){if(!session)return authView();const seq=++loadSeq;try{const [next,prefs]=await Promise.all([api("state"),rpcV44("qf_v52_profile_preferences",{}).catch(()=>null)]);if(seq!==loadSeq)return;if(prefs){next.me.profile_color=prefs.profile_color||"violet";next.profile_colors=Object.fromEntries((prefs.member_colors||[]).map(x=>[x.person_id,x.profile_color||"violet"]))}else{next.me.profile_color="violet";next.profile_colors={}}if(!force&&hasUnsavedWork()){state=next;return}state=next;render()}catch(e){if(seq!==loadSeq)return;if(String(e.message).includes("Session")){localStorage.removeItem("qf_session");session="";authView()}else alert(e.message)}}

if("serviceWorker" in navigator){navigator.serviceWorker.register("/sw.js").catch(()=>{})}load(true);setInterval(()=>{if(session&&!hasUnsavedWork())load(false)},10000);
