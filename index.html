<!doctype html>
<html lang="fr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4f46e5"><title>QuestiFamille</title>
<style>
:root{--p:#5b4cf0;--p2:#7c3aed;--p3:#2563eb;--bg:#f5f6fb;--text:#15182a;--muted:#747b90;--line:#e7e9f2;--ok:#16a34a;--bad:#dc2626;--gold:#f59e0b;--card:#fff;--shadow:0 14px 40px rgba(31,35,72,.09)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 10% 0%,#ede9fe 0,transparent 25rem),linear-gradient(180deg,#f7f7fc,#f2f4fa);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--text);min-height:100vh}
header{background:linear-gradient(135deg,#4f46e5 0%,#6d4df5 48%,#2563eb 100%);color:#fff;padding:22px 18px 30px;position:relative;overflow:hidden;box-shadow:0 10px 28px rgba(79,70,229,.24)}
header:after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;background:#ffffff18;right:-60px;top:-70px}h1{margin:0;font-size:29px;letter-spacing:-.7px}header p{margin:5px 0 0;opacity:.88;font-weight:550}.bell{position:absolute;right:18px;top:20px;z-index:2;background:#ffffff1f;border:1px solid #ffffff3b;backdrop-filter:blur(10px);min-width:72px}
main{max-width:880px;margin:auto;padding:14px}.card{background:rgba(255,255,255,.94);border:1px solid rgba(255,255,255,.75);border-radius:24px;padding:18px;margin:13px 0;box-shadow:var(--shadow);backdrop-filter:blur(10px)}
h2{margin-top:0;font-size:22px;letter-spacing:-.35px}h3{margin-bottom:10px}input,textarea,select{width:100%;padding:13px 14px;border:1px solid #dfe3ee;border-radius:14px;margin:6px 0 10px;font:inherit;background:#fbfcff;color:var(--text);outline:none;transition:.18s}input:focus,textarea:focus,select:focus{border-color:#8175f5;box-shadow:0 0 0 4px #6d5df018;background:#fff}textarea{min-height:84px;resize:vertical}
button{border:0;border-radius:14px;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;padding:12px 15px;font:inherit;font-weight:760;cursor:pointer;min-height:44px;box-shadow:0 7px 18px rgba(91,76,240,.18);transition:transform .12s ease,opacity .12s ease}button:active{transform:scale(.98)}button:disabled{opacity:.55;cursor:wait;transform:none}button.ok{background:linear-gradient(135deg,#16a34a,#22c55e)}button.bad{background:linear-gradient(135deg,#dc2626,#ef4444)}button.gold{background:linear-gradient(135deg,#d97706,#f59e0b)}button.ghost{background:#f0efff;color:#4438ca;box-shadow:none;border:1px solid #dedcff}button.soft{background:#f7f7fb;color:#394056;box-shadow:none;border:1px solid var(--line)}
.tabs{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin:12px 0}.tabs button{font-size:12px;padding:10px 4px;background:#fff;color:#3e4660;border:1px solid #e8eaf2;box-shadow:0 7px 18px rgba(32,35,60,.06)}.tabs .active{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;border-color:transparent}.hidden{display:none!important}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{background:linear-gradient(145deg,#f6f5ff,#eef2ff);border:1px solid #e6e4ff;border-radius:18px;padding:15px}.stat b{display:block;font-size:25px;color:#3f36b7}.member,.quest,.hist,.shopitem,.note,.redeem,.recurring{border:1px solid var(--line);border-radius:18px;padding:14px;margin:10px 0;background:#fff;box-shadow:0 6px 18px rgba(22,26,55,.04)}
.quest{position:relative;overflow:hidden}.quest:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(var(--p),var(--p3))}.member{display:flex;justify-content:space-between;align-items:center;gap:10px}.member-main{display:flex;align-items:center;gap:10px;min-width:0;flex:1}.member-actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.member-actions button,.member-actions select{width:auto;margin:0;padding:9px 10px;min-height:38px;font-size:13px}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:120px}.badge{display:inline-flex;align-items:center;gap:4px;background:#eeefff;color:#4b41bf;border-radius:99px;padding:5px 9px;font-size:12px;font-weight:700}.points{font-weight:850;color:#9a6700}.avatar{display:grid;place-items:center;width:44px;height:44px;border-radius:15px;background:linear-gradient(145deg,#f0efff,#e6e9ff);font-size:24px;flex:0 0 auto}
small,.muted{color:var(--muted)}.notice{background:#fff9ed;border:1px solid #fde7b0;border-radius:16px;padding:13px}.link{word-break:break-all;background:#f4f5f9;padding:11px;border-radius:12px;border:1px solid #e5e7ef}.unread{background:#f3f2ff}.shopgrid{display:grid;grid-template-columns:1fr;gap:10px}.recurring{border-style:dashed;border-color:#aaa3ff;background:#fafaff}.family-tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.danger-zone{margin-top:18px;padding:14px;border-radius:17px;background:#fff7f7;border:1px solid #fecaca}.share-card{margin-top:16px;padding:14px;border-radius:18px;background:linear-gradient(145deg,#f5f3ff,#eef6ff);border:1px solid #e0ddff}.hero{padding:18px;border-radius:20px;background:linear-gradient(145deg,#f7f6ff,#eef4ff);border:1px solid #e4e2ff;margin-bottom:14px}.hero strong{font-size:18px}.section-kicker{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#6d63d9;font-weight:800}.status{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:800}.st-open{background:#eef2ff;color:#4338ca}.st-submitted{background:#fff7ed;color:#c2410c}.st-validated{background:#ecfdf5;color:#15803d}.st-failed{background:#fef2f2;color:#b91c1c}.progress{height:11px;background:#eceef5;border-radius:999px;overflow:hidden;margin:8px 0}.progress>span{display:block;height:100%;background:linear-gradient(90deg,var(--p),var(--p3));border-radius:999px}.mini-list{display:grid;gap:10px;margin-top:12px}.mini{border:1px solid var(--line);border-radius:16px;padding:12px;background:#fff}.child-summary{display:grid;gap:10px;margin-top:12px}.child-card{border:1px solid var(--line);border-radius:17px;padding:13px;background:#fff}.goal{padding:14px;border:1px solid #e3e0ff;background:#faf9ff;border-radius:18px;margin:12px 0}.status-line{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin:7px 0}.template-row{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0 12px}.template-row button{min-height:38px;padding:8px 10px;font-size:13px}.checklist{display:grid;gap:6px;margin:7px 0 10px}.checklist label{display:flex;gap:8px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px}.checklist input{width:auto;margin:0}.my-requests{margin-top:18px}
@media(min-width:620px){.stats{grid-template-columns:repeat(4,1fr)}.shopgrid{grid-template-columns:repeat(2,1fr)}}@media(max-width:620px){main{padding:10px}.tabs{grid-template-columns:repeat(3,1fr)}.card{border-radius:20px;padding:15px}.family-tools{grid-template-columns:1fr}.member{align-items:flex-start;flex-direction:column}.member-actions{width:100%;justify-content:stretch}.member-actions>*{flex:1}}
</style></head><body>
<header><h1>QuestiFamille</h1><p>Quêtes, points, récompenses et famille</p><button id="bell" class="bell hidden">🔔 <span id="bellCount">0</span></button></header>
<main><section id="auth" class="card"></section><section id="app" class="hidden">
<div class="tabs"><button data-tab="home" class="active">🏠<br>Accueil</button><button data-tab="quests">🎯<br>Quêtes</button><button data-tab="shop">🛍️<br>Boutique</button><button data-tab="family">👨‍👩‍👧<br>Famille</button><button data-tab="profile">🙂<br>Profil</button><button data-tab="history">📜<br>Historique</button></div>
<section id="home" class="card tab"></section><section id="quests" class="card tab hidden"></section><section id="shop" class="card tab hidden"></section><section id="family" class="card tab hidden"></section><section id="profile" class="card tab hidden"></section><section id="history" class="card tab hidden"></section>
</section></main>
<script>
const API="https://lsnfspsdzvjkrwrjfvgl.supabase.co/functions/v1/questifamille",FAMILY_API="https://lsnfspsdzvjkrwrjfvgl.supabase.co/functions/v1/questifamille-family",BASE=location.origin+location.pathname,invite=new URLSearchParams(location.search).get("invite"),$=id=>document.getElementById(id);
let session=localStorage.getItem("qf_session")||"",state=null,current="home";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
const fmt=d=>d?new Date(d).toLocaleString("fr-FR",{dateStyle:"short",timeStyle:"short"}):"Aucune";
const labels={family_created:"Famille créée",member_joined:"Membre arrivé",member_role_changed:"Rôle modifié",profile_updated:"Profil modifié",quest_created:"Quête créée",quest_updated:"Quête modifiée",quest_deleted:"Quête supprimée",quest_submitted:"Quête terminée",quest_validated:"Quête validée",quest_refused:"Quête refusée",reward_given:"Récompense remise",points_adjusted:"Points modifiés",shop_item_created:"Article boutique ajouté",shop_item_deleted:"Article boutique retiré",shop_item_redeemed:"Récompense boutique demandée",shop_redemption_approved:"Demande boutique approuvée",shop_redemption_given:"Récompense boutique remise",shop_redemption_cancelled:"Demande boutique annulée",invite_created:"Invitation créée",recurring_quest_created:"Quête récurrente créée",recurring_quest_generated:"Quête récurrente générée",recurring_quest_enabled:"Quête récurrente activée",recurring_quest_disabled:"Quête récurrente mise en pause",member_left:"Membre parti",member_removed:"Membre retiré",ownership_transferred:"Propriété transmise"};
async function requestApi(url,action,data={}){const active=document.activeElement,btn=active instanceof HTMLButtonElement?active:null;if(btn)btn.disabled=true;try{const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json","x-session-token":session},body:JSON.stringify({action,...data})});const j=await r.json();if(!r.ok)throw new Error(j.error||"Erreur");return j}finally{if(btn&&document.body.contains(btn))btn.disabled=false}}
async function api(action,data={}){return requestApi(API,action,data)}
async function familyApi(action,data={}){return requestApi(FAMILY_API,action,data)}
function localDateTimeValue(value){if(!value)return"";const d=new Date(value);if(Number.isNaN(d.getTime()))return"";const p=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+"T"+p(d.getHours())+":"+p(d.getMinutes())}
function deadlineIso(){const v=$("dead")?.value||"";if(!v)return null;const d=new Date(v);return Number.isNaN(d.getTime())?null:d.toISOString()}
function hasUnsavedWork(){const a=document.activeElement;if(a&&["INPUT","TEXTAREA","SELECT"].includes(a.tagName))return true;if(current==="quests"&&($("qform")?.children.length||0)>0)return true;if(current==="shop"&&($("itemform")?.children.length||0)>0)return true;if(current==="family"&&($("inviteOut")?.textContent||"").trim())return true;if(current==="profile"&&state){const nick=$("nick"),av=$("av");if(nick&&nick.value!==(state.me.nickname||""))return true;if(av&&av.value!==(state.me.avatar_emoji||"🙂"))return true}return false}
function authView(){$("app").classList.add("hidden");$("bell").classList.add("hidden");$("auth").classList.remove("hidden");if(invite){$("auth").innerHTML='<h2>👨‍👩‍👧 Rejoindre une famille</h2><p>Tu as reçu une invitation.</p><input id="jf" placeholder="Prénom"><input id="jl" placeholder="Nom"><button id="join">Rejoindre</button>';$("join").onclick=async()=>{try{let r=await api("join_invite",{invite,first_name:$("jf").value,last_name:$("jl").value});session=r.session_token;localStorage.setItem("qf_session",session);history.replaceState({},document.title,BASE);load()}catch(e){alert(e.message)}}}else{$("auth").innerHTML='<h2>Créer une famille</h2><input id="fn" placeholder="Nom de famille"><input id="pf" placeholder="Prénom du parent"><input id="pl" placeholder="Nom du parent"><button id="create">Créer la famille</button>';$("create").onclick=async()=>{try{let r=await api("create_family",{family_name:$("fn").value,first_name:$("pf").value,last_name:$("pl").value});session=r.session_token;localStorage.setItem("qf_session",session);load()}catch(e){alert(e.message)}}}}
function person(id){return state.members.find(m=>m.person_id===id)}function bal(id){return Number(state.balances?.[id]||0)}
function reward(q){let a=q.reward_type==="money"?"💶 "+Number(q.reward_amount||0).toFixed(2).replace(".",",")+" €":q.reward_type==="none"?"🎯 Aucune":({privilege:"🎮",activity:"🎬",object:"🎁",other:"⭐"}[q.reward_type]||"🎁")+" "+esc(q.reward_text||"Récompense");if(q.points_reward)a+=" · ⭐ "+q.points_reward+" pts";return a}
function statusInfo(s){return s==="open"?["À faire","st-open","📝"]:s==="submitted"?["En attente","st-submitted","⏳"]:s==="validated"?["Validée","st-validated","✅"]:s==="failed"?["À refaire","st-failed","🔁"]:[s||"Inconnu","st-open","•"]}
function redemptionLabel(s){return s==="requested"?"Demandée":s==="approved"?"Acceptée":s==="given"?"Remise":s==="cancelled"?"Annulée":s}
function goalKey(){return "qf_goal_"+state.family.id+"_"+state.me.id}
function currentGoalId(){return localStorage.getItem(goalKey())||""}
function setGoalLocal(id){if(id)localStorage.setItem(goalKey(),id);else localStorage.removeItem(goalKey());render()}
function pct(a,b){return b>0?Math.max(0,Math.min(100,Math.round(a/b*100))):100}
function isToday(d){if(!d)return false;const x=new Date(d),n=new Date();return x.getFullYear()===n.getFullYear()&&x.getMonth()===n.getMonth()&&x.getDate()===n.getDate()}
function render(){
$("auth").classList.add("hidden");$("app").classList.remove("hidden");$("bell").classList.remove("hidden");const manager=["owner","adult"].includes(state.me.role),owner=state.me.role==="owner",unread=state.notifications.filter(n=>!n.read_at).length;$("bellCount").textContent=unread;
const myAss=state.assignments.filter(a=>a.person_id===state.me.id),myOpen=myAss.filter(a=>a.status==="open"),mySubmitted=myAss.filter(a=>a.status==="submitted"),myValidated=myAss.filter(a=>a.status==="validated"),submitted=state.assignments.filter(a=>a.status==="submitted"),toGive=state.assignments.filter(a=>a.status==="validated"&&!a.reward_given);
const hero=`<div class="hero"><div class="section-kicker">${manager?"Espace parent":"Mon espace"}</div><h2>${esc(state.me.avatar_emoji||"🙂")} Bonjour ${esc(state.me.nickname||state.me.first_name)} 👋</h2><p>Famille <b>${esc(state.family.name)}</b> · <span class="badge">${state.me.role==="owner"?"👑 Créateur / Parent":state.me.role==="adult"?"🧑 Adulte":"👦 Enfant"}</span></p></div>`;
if(manager){
  const kids=state.members.filter(m=>m.role==="child");
  const childCards=kids.map(k=>{const ass=state.assignments.filter(a=>a.person_id===k.person_id),todo=ass.filter(a=>a.status==="open").length,wait=ass.filter(a=>a.status==="submitted").length,done=ass.filter(a=>a.status==="validated").length;return `<div class="child-card"><div class="member-main"><span class="avatar">${esc(k.avatar_emoji||"🙂")}</span><span><b>${esc(k.nickname||k.first_name)}</b><br><small>⭐ ${bal(k.person_id)} pts · ${todo} à faire · ${wait} en attente · ${done} validée(s)</small></span></div></div>`}).join("");
  const urgent=submitted.slice(0,4).map(a=>{const q=state.quests.find(q=>q.id===a.quest_id),p=person(a.person_id);return `<div class="mini"><b>⏳ ${esc(p?.first_name||"Membre")} attend une validation</b><br><small>${esc(q?.title||"Quête")}</small></div>`}).join("");
  $("home").innerHTML=hero+`<div class="stats"><div class="stat"><small>À valider</small><b>${submitted.length}</b></div><div class="stat"><small>Récompenses à remettre</small><b>${toGive.length}</b></div><div class="stat"><small>Enfants</small><b>${kids.length}</b></div><div class="stat"><small>Quêtes</small><b>${state.quests.length}</b></div></div><h3>À traiter maintenant</h3><div class="mini-list">${urgent||'<div class="mini"><b>✅ Rien en attente</b><br><small>Tout est à jour.</small></div>'}</div><h3>Résumé des enfants</h3><div class="child-summary">${childCards||'<p>Aucun enfant dans la famille.</p>'}</div>`;
}else{
  const today=myOpen.filter(a=>{const q=state.quests.find(q=>q.id===a.quest_id);return !q?.deadline||isToday(q.deadline)}).slice(0,5).map(a=>{const q=state.quests.find(q=>q.id===a.quest_id);return `<div class="mini"><b>${esc(q?.title||"Quête")}</b><br><small>${q?.deadline?"Pour "+fmt(q.deadline):"Sans limite"} · ${q?.points_reward?"⭐ "+q.points_reward+" pts":""}</small></div>`}).join("");
  const gid=currentGoalId(),goal=state.shop.find(i=>i.id===gid),pointsNow=bal(state.me.id),fallback=state.shop.filter(i=>i.points_cost>pointsNow).sort((a,b)=>a.points_cost-b.points_cost)[0]||state.shop.slice().sort((a,b)=>a.points_cost-b.points_cost)[0];const target=goal||fallback;
  const goalHtml=target?`<div class="goal"><div class="section-kicker">Objectif récompense</div><b>🎁 ${esc(target.title)}</b><div class="progress"><span style="width:${pct(pointsNow,target.points_cost)}%"></span></div><small>${pointsNow} / ${target.points_cost} points · ${pct(pointsNow,target.points_cost)}%</small>${gid?'<p><button class="soft" onclick="setGoalLocal(\'\')">Changer d’objectif</button></p>':'<p><small>Choisis un objectif dans la boutique.</small></p>'}</div>`:'<div class="goal"><b>🎁 Aucun objectif disponible</b><p><small>Le parent peut ajouter une récompense dans la boutique.</small></p></div>';
  const latest=state.redemptions.filter(r=>r.person_id===state.me.id).slice(0,3).map(r=>{const item=state.shop.find(i=>i.id===r.shop_item_id);return `<div class="mini"><b>${esc(item?.title||"Récompense")}</b><br><small>${redemptionLabel(r.status)} · ${r.points_spent} pts${r.decision_reason?" · "+esc(r.decision_reason):""}</small></div>`}).join("");
  $("home").innerHTML=hero+`<div class="stats"><div class="stat"><small>Mes points</small><b>${pointsNow}</b></div><div class="stat"><small>À faire</small><b>${myOpen.length}</b></div><div class="stat"><small>En attente</small><b>${mySubmitted.length}</b></div><div class="stat"><small>Validées</small><b>${myValidated.length}</b></div></div>${goalHtml}<h3>Mes quêtes du jour</h3><div class="mini-list">${today||'<div class="mini"><b>🎉 Rien à faire aujourd’hui</b></div>'}</div><h3>Mes demandes récentes</h3><div class="mini-list">${latest||'<div class="mini"><small>Aucune demande de récompense.</small></div>'}</div>`;
}
let qh=state.quests.map(q=>{let ass=state.assignments.filter(a=>a.quest_id===q.id),mine=ass.find(a=>a.person_id===state.me.id),actions="",status="";if(mine){const si=statusInfo(mine.status);status=`<div class="status-line"><span class="status ${si[1]}">${si[2]} ${si[0]}</span>${mine.refusal_reason?`<small>Motif : ${esc(mine.refusal_reason)}</small>`:""}</div>`;if(mine.status==="open")actions+=`<div class="row"><button onclick="submitQ('${q.id}')">✅ J’ai terminé</button><button class="ghost" onclick="helpQ('${q.id}')">🙋 J’ai besoin d’aide</button></div>`}if(manager){actions+=`<div class="row"><button class="ghost" onclick="editQ('${q.id}')">✏️ Modifier</button><button class="soft" onclick="duplicateQ('${q.id}')">📄 Dupliquer</button><button class="bad" onclick="deleteQ('${q.id}')">🗑️ Supprimer</button></div>`;actions+=ass.filter(a=>a.status==="submitted").map(a=>`<div class="row"><button class="ok" onclick="reviewQ('${q.id}','${a.person_id}',true)">✔️ Valider ${esc(person(a.person_id)?.first_name||"")}</button><button class="bad" onclick="reviewQ('${q.id}','${a.person_id}',false)">🔁 À refaire</button></div>`).join("");actions+=ass.filter(a=>a.status==="validated"&&!a.reward_given&&q.reward_type!=="none").map(a=>`<button onclick="rewardQ('${q.id}','${a.person_id}')">🎁 Récompense remise à ${esc(person(a.person_id)?.first_name||"")}</button>`).join("")}return `<div class="quest"><b>${esc(q.title)}</b> <span class="badge">${q.quest_type==="personal"?"👤 Personnelle":q.quest_type==="general"?"🌍 Générale":"👨‍👩‍👧 Collective"}</span>${status}<p>${esc(q.description||"")}</p><small>Limite : ${fmt(q.deadline)} · ${reward(q)}${q.penalty?` · Conséquence : ${esc(q.penalty)}`:""}</small><p>${actions}</p></div>`}).join("");
let rh=(state.recurring||[]).map(r=>`<div class="recurring"><b>🔁 ${esc(r.title)}</b><p><small>${r.frequency==="daily"?"Tous les jours":"Chaque semaine"} · échéance ${esc(r.due_time||"18:00")} · ⭐ ${r.points_reward||0} pts · ${r.active?"active":"en pause"}</small></p>${manager?`<button class="ghost" onclick="toggleRecurring('${r.id}',${!r.active})">${r.active?"⏸️ Mettre en pause":"▶️ Réactiver"}</button>`:""}</div>`).join("");
$("quests").innerHTML='<h2>🎯 Quêtes</h2>'+(manager?'<div class="row"><button id="newq">➕ Nouvelle quête</button><button id="newrq" class="ghost">🔁 Quête répétitive</button></div><div id="qform"></div>':'')+(rh?'<h3>🔁 Quêtes répétitives</h3>'+rh:'')+qh;if(manager){$("newq").onclick=()=>questForm();$("newrq").onclick=()=>recurringForm();}
let items=state.shop.map(i=>{const enough=bal(state.me.id)>=i.points_cost,gid=currentGoalId();return `<div class="shopitem"><b>${esc(i.title)}</b><p>${esc(i.description||"")}</p><div class="points">⭐ ${i.points_cost} points</div>${state.me.role==="child"?`<div class="progress"><span style="width:${pct(bal(state.me.id),i.points_cost)}%"></span></div><small>${bal(state.me.id)} / ${i.points_cost} pts</small><div class="row"><button class="ghost" onclick="setGoalLocal('${i.id}')">${gid===i.id?"🎯 Objectif choisi":"🎯 Choisir comme objectif"}</button><button ${enough?"":"disabled"} onclick="redeem('${i.id}')">${enough?"Prendre":"Pas assez de points"}</button></div>`:`<button class="bad" onclick="deleteItem('${i.id}')">Retirer</button>`}</div>`}).join("");
let reqs=state.redemptions.map(r=>{let item=state.shop.find(i=>i.id===r.shop_item_id),p=person(r.person_id);return `<div class="redeem"><b>${esc(p?.first_name||"Membre")} · ${esc(item?.title||"Récompense")}</b><br><small>${r.points_spent} pts · ${redemptionLabel(r.status)}${r.decision_reason?" · "+esc(r.decision_reason):""}</small>${manager&&r.status!=="given"&&r.status!=="cancelled"?`<div class="row"><button class="ok" onclick="reviewRed('${r.id}','approved')">Approuver</button><button class="gold" onclick="reviewRed('${r.id}','given')">Remise</button><button class="bad" onclick="reviewRed('${r.id}','cancelled')">Annuler</button></div>`:""}</div>`}).join("");
const myReqs=state.redemptions.filter(r=>r.person_id===state.me.id).map(r=>{let item=state.shop.find(i=>i.id===r.shop_item_id);return `<div class="redeem"><b>${esc(item?.title||"Récompense")}</b><br><small>${redemptionLabel(r.status)} · ${r.points_spent} pts${r.decision_reason?" · "+esc(r.decision_reason):""}</small></div>`}).join("");
$("shop").innerHTML=`<h2>🛍️ Boutique</h2><p>Solde : <b class="points">⭐ ${bal(state.me.id)} points</b></p>${manager?'<button id="newitem">➕ Ajouter une récompense</button><div id="itemform"></div>':""}<div class="shopgrid">${items||"<p>Aucun article pour le moment.</p>"}</div>${manager?`<h3>Demandes</h3>${reqs||"<p>Aucune demande.</p>"}`:`<div class="my-requests"><h3>Mes demandes</h3>${myReqs||"<p>Aucune demande pour le moment.</p>"}</div>`}`;if(manager)$("newitem").onclick=()=>{$("itemform").innerHTML='<div class="notice"><input id="it" placeholder="Récompense"><textarea id="idc" placeholder="Description / conditions"></textarea><input id="ic" type="number" min="1" placeholder="Coût en points"><button id="isave">Ajouter</button></div>';$("isave").onclick=async()=>{try{await api("create_shop_item",{title:$("it").value,description:$("idc").value,points_cost:Number($("ic").value)});load()}catch(e){alert(e.message)}}};
$("family").innerHTML=`<div class="section-kicker">Gestion familiale</div><h2>👨‍👩‍👧 ${esc(state.family.name)}</h2><p class="muted">${state.members.length} membre(s) dans la famille</p>`+state.members.map(m=>`<div class="member"><div class="member-main"><span class="avatar">${esc(m.avatar_emoji||"🙂")}</span><span style="min-width:0"><b>${esc(m.nickname||m.first_name+" "+m.last_name)}</b><br><small>${m.role==="owner"?"Créateur / propriétaire":m.role==="adult"?"Adulte":"Enfant"} · ⭐ ${bal(m.person_id)} pts</small></span></div><div class="member-actions">${owner&&m.role!=="owner"?`<select class="member-role" data-person-id="${m.person_id}"><option value="child" ${m.role==="child"?"selected":""}>Enfant</option><option value="adult" ${m.role==="adult"?"selected":""}>Adulte</option></select><button class="soft transfer-owner" data-person-id="${m.person_id}">👑 Transmettre</button><button class="bad remove-member" data-person-id="${m.person_id}">Retirer</button>`:""}${manager&&m.role==="child"?`<button class="ghost adjust-points" data-person-id="${m.person_id}">⭐ Points</button>`:""}</div></div>`).join("")+`<div class="share-card"><b>✨ Partager QuestiFamille</b><p class="muted">Tu peux envoyer le site à quelqu’un. Il pourra créer sa propre famille, sans rejoindre la tienne.</p><div class="row"><button id="shareApp">📤 Partager l’application</button>${owner?'<button id="inviteBtn" class="ghost">🔗 Inviter dans ma famille</button>':''}</div><div id="inviteOut"></div></div><div class="danger-zone"><b>Gestion du compte familial</b><p class="muted">${owner?"En tant que créateur, transmets d’abord la propriété si tu veux quitter la famille.":"Tu peux quitter cette famille. Ton accès sera retiré de cet appareil."}</p>${owner?"":'<button id="leaveBtn" class="bad">🚪 Quitter la famille</button>'}</div>`;
document.querySelectorAll(".member-role").forEach(el=>el.addEventListener("change",()=>roleChange(el.dataset.personId,el.value)));
document.querySelectorAll(".transfer-owner").forEach(el=>el.addEventListener("click",()=>{const m=person(el.dataset.personId);transferOwner(el.dataset.personId,m?.nickname||m?.first_name||"ce membre")}));
document.querySelectorAll(".remove-member").forEach(el=>el.addEventListener("click",()=>{const m=person(el.dataset.personId);removeMember(el.dataset.personId,m?.nickname||m?.first_name||"ce membre")}));
document.querySelectorAll(".adjust-points").forEach(el=>el.addEventListener("click",()=>points(el.dataset.personId)));
$("shareApp").onclick=async()=>{const url=location.origin;try{if(navigator.share){await navigator.share({title:"QuestiFamille",text:"Crée ta propre famille sur QuestiFamille",url})}else{$("inviteOut").innerHTML=`<p class="link">${esc(url)}</p>`}}catch{}};
if(owner)$("inviteBtn").onclick=async()=>{try{let r=await api("create_invite");$("inviteOut").innerHTML=`<p class="link">${esc(r.link)}</p><button id="copy">📋 Copier le lien</button>`;$("copy").onclick=()=>navigator.clipboard.writeText(r.link)}catch(e){alert(e.message)}};
if(!owner)$("leaveBtn").onclick=async()=>{if(!confirm("Quitter cette famille ? Tu perdras l’accès à ses quêtes et à sa boutique."))return;try{await familyApi("leave_family");localStorage.removeItem("qf_session");session="";location.href=location.origin}catch(e){alert(e.message)}};
$("profile").innerHTML=`<h2>🙂 Profil</h2><label>Emoji</label><input id="av" value="${esc(state.me.avatar_emoji||"🙂")}"><label>Surnom</label><input id="nick" value="${esc(state.me.nickname||"")}"><p><small>Nom : ${esc(state.me.first_name+" "+state.me.last_name)}</small></p><button id="saveProfile">Enregistrer</button> <button id="notifyDevice" class="ghost">🔔 Activer les notifications du téléphone</button>`;$("saveProfile").onclick=async()=>{try{await api("update_profile",{nickname:$("nick").value,avatar_emoji:$("av").value});load()}catch(e){alert(e.message)}};$("notifyDevice").onclick=enablePush;
$("history").innerHTML='<h2>📜 Historique</h2>'+state.history.map(h=>`<div class="hist"><b>${esc(labels[h.action]||h.action.replaceAll("_"," "))}</b><br><small>${fmt(h.created_at)}</small>${h.details?.title?`<p>${esc(h.details.title)}</p>`:""}${h.details?.reason?`<small>Motif : ${esc(h.details.reason)}</small>`:""}</div>`).join("");show(current);if(unread>0&&Notification.permission==="granted"){let n=state.notifications.find(x=>!x.read_at);try{new Notification(n.title,{body:n.message})}catch{}}
}
function questForm(q=null,duplicate=false){let kids=state.members.filter(m=>m.role==="child"),editing=!!q&&!duplicate,source=q||{};$('qform').innerHTML=`<div class="notice"><div class="template-row">${!editing?'<button type="button" class="soft qt-template" data-t="devoirs">📚 Devoirs</button><button type="button" class="soft qt-template" data-t="chambre">🛏️ Chambre</button><button type="button" class="soft qt-template" data-t="vaisselle">🍽️ Vaisselle</button><button type="button" class="soft qt-template" data-t="table">🥄 Mettre la table</button>':''}</div><input id="qt" placeholder="Titre" value="${esc(source.title||"")}"><textarea id="qd" placeholder="Description">${esc(source.description||"")}</textarea>${editing?'':`<div class="checklist"><b>Pour qui ?</b>${kids.map(c=>`<label><input class="kidcheck" type="checkbox" value="${c.person_id}"> ${esc(c.first_name+' '+c.last_name)}</label>`).join('')}</div><select id="rt"><option value="none">Aucune récompense</option><option value="money">💶 Argent</option><option value="privilege">🎮 Privilège</option><option value="activity">🎬 Activité</option><option value="object">🎁 Objet</option><option value="other">⭐ Autre</option></select><input id="rw" placeholder="Récompense (ex : 30 min de console ou 5)" value="${esc(source.reward_type==='money'?source.reward_amount||'':source.reward_text||'')}">`}<input id="pts" type="number" min="0" placeholder="Points gagnés" value="${source.points_reward||0}"><input id="pen" placeholder="Conséquence si non terminée" value="${esc(source.penalty||'')}"><input id="dead" type="datetime-local"><button id="saveq">${editing?'Enregistrer':duplicate?'Créer la copie':'Créer'}</button></div>`;
if(source.deadline){try{$('dead').value=localDateTimeValue(source.deadline)}catch{}}
if(!editing&&source.reward_type)$('rt').value=source.reward_type;
const templates={devoirs:{title:'Faire les devoirs',description:'Terminer les devoirs prévus et préparer les affaires pour demain.'},chambre:{title:'Ranger sa chambre',description:'Ranger les affaires, le sol et remettre la chambre en ordre.'},vaisselle:{title:'Aider pour la vaisselle',description:'Aider à débarrasser, laver ou ranger la vaisselle.'},table:{title:'Mettre la table',description:'Préparer la table avant le repas.'}};
document.querySelectorAll('.qt-template').forEach(b=>b.addEventListener('click',()=>{const t=templates[b.dataset.t];$('qt').value=t.title;$('qd').value=t.description}));
$('saveq').onclick=async()=>{try{if(editing){await api('edit_quest',{quest_id:source.id,title:$('qt').value,description:$('qd').value,points_reward:Number($('pts').value||0),penalty:$('pen').value,deadline:deadlineIso()})}else{const targets=[...document.querySelectorAll('.kidcheck:checked')].map(x=>x.value);if(!targets.length){alert('Choisis au moins un enfant.');return}let rt=$('rt').value,rw=$('rw').value,qtype=targets.length===1?'personal':'collective';await api('create_quest',{title:$('qt').value,description:$('qd').value,quest_type:qtype,reward_type:rt,reward_text:rt==='money'?'':rw,reward_amount:rt==='money'?Number(rw||0):0,points_reward:Number($('pts').value||0),penalty:$('pen').value,deadline:deadlineIso(),target_person_id:targets.length===1?targets[0]:null,target_person_ids:targets})}load()}catch(e){alert(e.message)}}}

function recurringForm(){
  let kids=state.members.filter(m=>m.role==="child");
  $("qform").innerHTML=`<div class="notice"><h3>🔁 Nouvelle quête répétitive</h3><input id="rqt" placeholder="Titre"><textarea id="rqd" placeholder="Description"></textarea><select id="rqtarget"><option value="">Tous les enfants</option>${kids.map(c=>`<option value="${c.person_id}">${esc(c.first_name+" "+c.last_name)}</option>`).join("")}</select><select id="rqfreq"><option value="daily">Tous les jours</option><option value="weekly">Chaque semaine</option></select><div id="weekdays" class="hidden"><label><input type="checkbox" value="1"> Lundi</label><label><input type="checkbox" value="2"> Mardi</label><label><input type="checkbox" value="3"> Mercredi</label><label><input type="checkbox" value="4"> Jeudi</label><label><input type="checkbox" value="5"> Vendredi</label><label><input type="checkbox" value="6"> Samedi</label><label><input type="checkbox" value="0"> Dimanche</label></div><input id="rqtime" type="time" value="18:00"><input id="rqpts" type="number" min="0" value="10" placeholder="Points gagnés"><input id="rqpen" placeholder="Conséquence si non terminée"><button id="rqsave">Créer la quête répétitive</button></div>`;
  $("rqfreq").onchange=()=>$("weekdays").classList.toggle("hidden",$("rqfreq").value!=="weekly");
  $("rqsave").onclick=async()=>{try{let target=$("rqtarget").value;let days=[...document.querySelectorAll('#weekdays input:checked')].map(x=>Number(x.value));if($("rqfreq").value==="weekly"&&!days.length)return alert("Choisis au moins un jour.");await api("create_recurring_quest",{title:$("rqt").value,description:$("rqd").value,target_person_ids:target?[target]:[],frequency:$("rqfreq").value,weekdays:days,due_time:$("rqtime").value,points_reward:Number($("rqpts").value||0),penalty:$("rqpen").value});load()}catch(e){alert(e.message)}};
}
window.toggleRecurring=async(id,active)=>{try{await api("toggle_recurring_quest",{template_id:id,active});load()}catch(e){alert(e.message)}};
function b64ToUint8Array(base64){const padding="=".repeat((4-base64.length%4)%4),b64=(base64+padding).replace(/-/g,"+").replace(/_/g,"/");const raw=atob(b64);return Uint8Array.from([...raw].map(c=>c.charCodeAt(0)))}
async function enablePush(){
  try{
    if(!("serviceWorker" in navigator)||!("PushManager" in window)||!("Notification" in window))return alert("Les notifications push ne sont pas compatibles sur ce navigateur.");
    const permission=await Notification.requestPermission();if(permission!=="granted")return alert("Autorisation non accordée.");
    const reg=await navigator.serviceWorker.register("/sw.js");await navigator.serviceWorker.ready;
    let sub=await reg.pushManager.getSubscription();
    if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64ToUint8Array(state.vapid_public_key)});
    const j=sub.toJSON();await api("save_push_subscription",{subscription:{endpoint:sub.endpoint,keys:j.keys}});
    alert("Notifications push activées 👍");
  }catch(e){alert("Impossible d’activer les notifications : "+e.message)}
}

$("bell").onclick=async()=>{current="home";show("home");$("home").insertAdjacentHTML("afterbegin",'<h3>🔔 Notifications</h3>'+state.notifications.map(n=>`<div class="note ${n.read_at?"":"unread"}"><b>${esc(n.title)}</b><p>${esc(n.message)}</p><small>${fmt(n.created_at)}</small></div>`).join(""));try{await api("mark_notifications_read");$("bellCount").textContent="0"}catch{}};
async function load(){if(!session)return authView();try{state=await api("state");render()}catch(e){if(String(e.message).includes("Session")){localStorage.removeItem("qf_session");session="";authView()}else alert(e.message)}}
function show(id){current=id;document.querySelectorAll(".tab").forEach(x=>x.classList.add("hidden"));$(id).classList.remove("hidden");document.querySelectorAll("[data-tab]").forEach(b=>b.classList.toggle("active",b.dataset.tab===id))}
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>show(b.dataset.tab));
window.submitQ=async id=>{try{await api("submit_quest",{quest_id:id});load()}catch(e){alert(e.message)}};
window.helpQ=async id=>{const q=state.quests.find(x=>x.id===id),txt=`J’ai besoin d’aide pour la quête : ${q?.title||'ma quête'}`;try{if(navigator.share)await navigator.share({title:'QuestiFamille',text:txt,url:location.origin});else alert(txt)}catch{}};
window.reviewQ=async(q,p,a)=>{let reason="";if(!a){reason=prompt("Pourquoi cette quête est à refaire ?")||"";if(!reason.trim())return}try{await api("review_quest",{quest_id:q,person_id:p,approve:a,reason});load()}catch(e){alert(e.message)}};
window.rewardQ=async(q,p)=>{try{await api("reward_given",{quest_id:q,person_id:p});load()}catch(e){alert(e.message)}};
window.roleChange=async(p,r)=>{try{await api("change_role",{person_id:p,role:r});load()}catch(e){alert(e.message)}};
window.removeMember=async(p,name)=>{if(!confirm(`Retirer ${name} de la famille ?`))return;try{await familyApi("remove_member",{person_id:p});load()}catch(e){alert(e.message)}};
window.transferOwner=async(p,name)=>{if(!confirm(`Transmettre la propriété de la famille à ${name} ? Tu deviendras adulte.`))return;try{await familyApi("transfer_ownership",{person_id:p});await load()}catch(e){alert(e.message)}};
window.editQ=id=>{show("quests");questForm(state.quests.find(q=>q.id===id))};
window.duplicateQ=id=>{show("quests");questForm(state.quests.find(q=>q.id===id),true)};
window.deleteQ=async id=>{if(confirm("Supprimer cette quête ?"))try{await api("delete_quest",{quest_id:id});load()}catch(e){alert(e.message)}};
window.points=async p=>{let a=prompt("Combien de points ? Mets un nombre négatif pour retirer.");if(a===null)return;let r=prompt("Raison ?","Bonus parent");try{await api("add_points",{person_id:p,amount:Number(a),reason:r||"Ajustement"});load()}catch(e){alert(e.message)}};
window.redeem=async id=>{if(confirm("Utiliser tes points pour cette récompense ?"))try{await api("redeem_shop_item",{item_id:id});load()}catch(e){alert(e.message)}};
window.deleteItem=async id=>{if(confirm("Retirer cet article de la boutique ?"))try{await api("delete_shop_item",{item_id:id});load()}catch(e){alert(e.message)}};
window.reviewRed=async(id,status)=>{let reason="";if(status==="cancelled"){reason=prompt("Raison de l’annulation ?")||"";if(!reason.trim())return}try{await api("review_redemption",{redemption_id:id,status,reason});load()}catch(e){alert(e.message)}};
if("serviceWorker" in navigator){navigator.serviceWorker.register("/sw.js").catch(()=>{})}load();setInterval(()=>{if(session&&!hasUnsavedWork())load()},10000);
</script></body></html>
