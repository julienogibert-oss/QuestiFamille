<!doctype html>
<html lang="fr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4f46e5"><title>QuestiFamille</title>
<style>
:root{--p:#4f46e5;--p2:#6366f1;--bg:#f5f7fb;--txt:#172033;--mut:#667085;--line:#e4e7ec;--ok:#15803d;--bad:#dc2626}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--txt)}header{background:linear-gradient(135deg,var(--p),var(--p2));color:white;padding:24px 20px 30px}h1{margin:0;font-size:29px}header p{margin:5px 0 0}main{max-width:780px;margin:auto;padding:14px}.card{background:#fff;border-radius:22px;padding:20px;margin:14px 0;box-shadow:0 8px 30px #10182810}input,textarea,select{width:100%;padding:13px;border:1px solid #d0d5dd;border-radius:13px;margin:6px 0 10px;font:inherit;background:#fff}textarea{min-height:86px}button{border:0;border-radius:14px;background:var(--p);color:#fff;padding:12px 15px;font:inherit;font-weight:750;cursor:pointer}.ok{background:var(--ok)}.bad{background:var(--bad)}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.tabs button{font-size:13px;padding:11px 3px}.tabs .active{background:#111827}.hidden{display:none!important}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{background:#f0f2ff;border-radius:16px;padding:14px}.stat b{display:block;font-size:24px}.member,.quest,.hist{border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}.member{display:flex;justify-content:space-between;align-items:center;gap:10px}.badge{display:inline-block;background:#eef2ff;border-radius:99px;padding:4px 8px;font-size:12px}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}.notice{background:#fff7ed;border:1px solid #fed7aa;border-radius:14px;padding:12px}.link{word-break:break-all;background:#f2f4f7;padding:10px;border-radius:12px}small{color:var(--mut)}@media(min-width:620px){.stats{grid-template-columns:repeat(4,1fr)}}
</style></head><body>
<header><h1>QuestiFamille</h1><p>Quêtes, récompenses et famille</p></header>
<main><section id="auth" class="card"></section><section id="app" class="hidden"><div class="tabs"><button data-tab="home" class="active">🏠<br>Accueil</button><button data-tab="quests">🎯<br>Quêtes</button><button data-tab="family">👨‍👩‍👧<br>Famille</button><button data-tab="history">📜<br>Historique</button></div><section id="home" class="card tab"></section><section id="quests" class="card tab hidden"></section><section id="family" class="card tab hidden"></section><section id="history" class="card tab hidden"></section></section></main>
<script>
const API='https://lsnfspsdzvjkrwrjfvgl.supabase.co/functions/v1/questifamille';const invite=new URLSearchParams(location.search).get('invite');const $=x=>document.getElementById(x);let session=localStorage.getItem('qf_session')||'',state=null,current='home';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const fmt=d=>d?new Date(d).toLocaleString('fr-FR',{dateStyle:'short',timeStyle:'short'}):'Aucune';
async function api(action,data={}){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','x-session-token':session},body:JSON.stringify({action,...data})});const j=await r.json();if(!r.ok)throw new Error(j.error||'Erreur');return j}
function auth(){app.classList.add('hidden');$('auth').classList.remove('hidden');if(invite){$('auth').innerHTML='<h2>👨‍👩‍👧 Rejoindre une famille</h2><p>Tu as reçu une invitation.</p><input id="jf" placeholder="Prénom"><input id="jl" placeholder="Nom"><button id="join">Rejoindre la famille</button>';$('join').onclick=async()=>{try{let r=await api('join_invite',{invite,first_name:$('jf').value,last_name:$('jl').value});session=r.session_token;localStorage.setItem('qf_session',session);history.replaceState({},document.title,location.pathname);load()}catch(e){alert(e.message)}}}else{$('auth').innerHTML='<h2>Créer une famille</h2><input id="fn" placeholder="Nom de famille"><input id="pf" placeholder="Prénom du parent"><input id="pl" placeholder="Nom du parent"><button id="create">Créer la famille</button>';$('create').onclick=async()=>{try{let r=await api('create_family',{family_name:$('fn').value,first_name:$('pf').value,last_name:$('pl').value});session=r.session_token;localStorage.setItem('qf_session',session);load()}catch(e){alert(e.message)}}}}
function person(id){return state.members.find(m=>m.person_id===id)}function reward(q){if(q.reward_type==='money')return '💶 '+Number(q.reward_amount||0).toFixed(2).replace('.',',')+' €';if(q.reward_type==='none')return '🎯 Aucune';return ({privilege:'🎮',activity:'🎬',object:'🎁',other:'⭐'}[q.reward_type]||'🎁')+' '+esc(q.reward_text||'Récompense')}
function render(){
 $('auth').classList.add('hidden');$('app').classList.remove('hidden');const manager=['owner','adult'].includes(state.me.role),owner=state.me.role==='owner';const active=state.assignments.filter(a=>['open','submitted'].includes(a.status)).length,validated=state.assignments.filter(a=>a.status==='validated').length,pending=state.assignments.filter(a=>a.status==='validated'&&!a.reward_given).length;
 $('home').innerHTML=`<h2>Bonjour ${esc(state.me.first_name)} 👋</h2><p>Famille : <b>${esc(state.family.name)}</b></p><div class="stats"><div class="stat"><b>${active}</b>actives</div><div class="stat"><b>${validated}</b>validées</div><div class="stat"><b>${pending}</b>récompenses</div><div class="stat"><b>${state.members.length}</b>membre(s)</div></div><h3>Ton rôle</h3><span class="badge">${state.me.role==='owner'?'👑 Créateur / Parent':state.me.role==='adult'?'🧑 Adulte':'👦 Enfant'}</span>`;
 let qh=state.quests.map(q=>{let ass=state.assignments.filter(a=>a.quest_id===q.id),mine=ass.find(a=>a.person_id===state.me.id),actions='';if(mine&&mine.status==='open')actions+=`<button onclick="submitQ('${q.id}')">✅ J’ai terminé</button>`;if(manager){actions+=ass.filter(a=>a.status==='submitted').map(a=>`<div class="row"><button class="ok" onclick="reviewQ('${q.id}','${a.person_id}',true)">✔️ Valider ${esc(person(a.person_id)?.first_name||'')}</button><button class="bad" onclick="reviewQ('${q.id}','${a.person_id}',false)">❌ Refuser</button></div>`).join('');actions+=ass.filter(a=>a.status==='validated'&&!a.reward_given&&q.reward_type!=='none').map(a=>`<button onclick="rewardQ('${q.id}','${a.person_id}')">🎁 Récompense remise à ${esc(person(a.person_id)?.first_name||'')}</button>`).join('')}return `<div class="quest"><b>${esc(q.title)}</b> <span class="badge">${q.quest_type==='personal'?'👤 Personnelle':q.quest_type==='general'?'🌍 Générale':'👨‍👩‍👧 Collective'}</span><p>${esc(q.description||'')}</p><small>Limite : ${fmt(q.deadline)} · ${reward(q)}</small><p>${actions}</p></div>`}).join('');
 $('quests').innerHTML='<h2>🎯 Quêtes</h2>'+(manager?'<button id="newq">➕ Nouvelle quête</button><div id="qform"></div>':'')+qh;if(manager)$('newq').onclick=()=>{let kids=state.members.filter(m=>m.role==='child');$('qform').innerHTML=`<div class="notice"><input id="qt" placeholder="Titre"><textarea id="qd" placeholder="Description"></textarea><select id="qty"><option value="general">🌍 Générale</option><option value="personal">👤 Personnelle</option><option value="collective">👨‍👩‍👧 Collective</option></select><select id="target"><option value="">Tous les enfants</option>${kids.map(c=>`<option value="${c.person_id}">${esc(c.first_name+' '+c.last_name)}</option>`).join('')}</select><select id="rt"><option value="none">Aucune récompense</option><option value="money">💶 Argent</option><option value="privilege">🎮 Privilège</option><option value="activity">🎬 Activité</option><option value="object">🎁 Objet</option><option value="other">⭐ Autre</option></select><input id="rw" placeholder="Récompense (ex : 30 min de console ou 5)"><input id="pen" placeholder="Conséquence si non terminée"><input id="dead" type="datetime-local"><button id="saveq">Créer</button></div>`;$('saveq').onclick=async()=>{try{let rt=$('rt').value,rw=$('rw').value,t=$('target').value;await api('create_quest',{title:$('qt').value,description:$('qd').value,quest_type:$('qty').value,reward_type:rt,reward_text:rt==='money'?'':rw,reward_amount:rt==='money'?Number(rw||0):0,penalty:$('pen').value,deadline:$('dead').value||null,target_person_id:t||null,target_person_ids:t?[t]:null});load()}catch(e){alert(e.message)}}};
 $('family').innerHTML='<h2>👨‍👩‍👧 Famille</h2>'+state.members.map(m=>`<div class="member"><span>${m.role==='owner'?'👑':m.role==='adult'?'🧑':'👦'} ${esc(m.first_name+' '+m.last_name)}</span>${owner&&m.role!=='owner'?`<select onchange="roleChange('${m.person_id}',this.value)"><option value="child" ${m.role==='child'?'selected':''}>Enfant</option><option value="adult" ${m.role==='adult'?'selected':''}>Adulte</option></select>`:`<small>${m.role}</small>`}</div>`).join('')+(owner?'<button id="inviteBtn">🔗 Créer un lien d’invitation</button><div id="inviteOut"></div>':'');if(owner)$('inviteBtn').onclick=async()=>{try{let r=await api('create_invite');$('inviteOut').innerHTML=`<p class="link">${esc(r.link)}</p><button id="copy">📋 Copier le lien</button>`;$('copy').onclick=()=>navigator.clipboard.writeText(r.link)}catch(e){alert(e.message)}};
 $('history').innerHTML='<h2>📜 Historique</h2>'+state.history.map(h=>`<div class="hist"><b>${esc(h.action.replaceAll('_',' '))}</b><br><small>${fmt(h.created_at)}</small></div>`).join('');show(current)
}
async function load(){if(!session)return auth();try{state=await api('state');render()}catch(e){if(String(e.message).includes('Session')){localStorage.removeItem('qf_session');session='';auth()}else alert(e.message)}}function show(id){current=id;document.querySelectorAll('.tab').forEach(x=>x.classList.add('hidden'));$(id).classList.remove('hidden');document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===id))}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>show(b.dataset.tab));window.submitQ=async id=>{try{await api('submit_quest',{quest_id:id});load()}catch(e){alert(e.message)}};window.reviewQ=async(q,p,a)=>{try{await api('review_quest',{quest_id:q,person_id:p,approve:a});load()}catch(e){alert(e.message)}};window.rewardQ=async(q,p)=>{try{await api('reward_given',{quest_id:q,person_id:p});load()}catch(e){alert(e.message)}};window.roleChange=async(p,r)=>{try{await api('change_role',{person_id:p,role:r});load()}catch(e){alert(e.message)}};load();setInterval(()=>{if(session)load()},7000);
</script></body></html>
