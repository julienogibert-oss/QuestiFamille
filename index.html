<!doctype html>
<html lang="fr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4f46e5"><title>QuestiFamille</title>
<style>
:root{--p:#4f46e5;--p2:#6366f1;--bg:#f5f7fb;--text:#172033;--muted:#667085;--line:#e4e7ec;--ok:#15803d;--bad:#dc2626;--gold:#f59e0b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--text)}
header{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;padding:22px 18px 28px;position:relative}h1{margin:0;font-size:28px}header p{margin:5px 0 0}.bell{position:absolute;right:18px;top:20px;background:#ffffff22;border:1px solid #ffffff44}
main{max-width:820px;margin:auto;padding:12px}.card{background:#fff;border-radius:22px;padding:18px;margin:12px 0;box-shadow:0 8px 30px #10182810}
input,textarea,select{width:100%;padding:12px;border:1px solid #d0d5dd;border-radius:13px;margin:6px 0 10px;font:inherit;background:#fff}textarea{min-height:78px}
button{border:0;border-radius:14px;background:var(--p);color:#fff;padding:11px 14px;font:inherit;font-weight:750;cursor:pointer}button.ok{background:var(--ok)}button.bad{background:var(--bad)}button.gold{background:var(--gold)}button.ghost{background:#eef2ff;color:#3730a3}
.tabs{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}.tabs button{font-size:12px;padding:10px 3px}.tabs .active{background:#111827}.hidden{display:none!important}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.stat{background:#f0f2ff;border-radius:16px;padding:13px}.stat b{display:block;font-size:23px}
.member,.quest,.hist,.shopitem,.note,.redeem{border:1px solid var(--line);border-radius:16px;padding:13px;margin:9px 0}.member{display:flex;justify-content:space-between;align-items:center;gap:10px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}.badge{display:inline-block;background:#eef2ff;border-radius:99px;padding:4px 8px;font-size:12px}.points{font-weight:800;color:#9a6700}
small,.muted{color:var(--muted)}.notice{background:#fff7ed;border:1px solid #fed7aa;border-radius:14px;padding:12px}.link{word-break:break-all;background:#f2f4f7;padding:10px;border-radius:12px}
.avatar{font-size:24px}.unread{background:#eef2ff}.shopgrid{display:grid;grid-template-columns:1fr;gap:10px}.recurring{border:1px dashed #a5b4fc;background:#f8faff;border-radius:16px;padding:13px;margin:9px 0}@media(min-width:620px){.stats{grid-template-columns:repeat(4,1fr)}.shopgrid{grid-template-columns:repeat(2,1fr)}}@media(max-width:620px){.tabs{grid-template-columns:repeat(3,1fr)}}
</style></head><body>
<header><h1>QuestiFamille</h1><p>Quêtes, points, récompenses et famille</p><button id="bell" class="bell hidden">🔔 <span id="bellCount">0</span></button></header>
<main><section id="auth" class="card"></section><section id="app" class="hidden">
<div class="tabs"><button data-tab="home" class="active">🏠<br>Accueil</button><button data-tab="quests">🎯<br>Quêtes</button><button data-tab="shop">🛍️<br>Boutique</button><button data-tab="family">👨‍👩‍👧<br>Famille</button><button data-tab="profile">🙂<br>Profil</button><button data-tab="history">📜<br>Historique</button></div>
<section id="home" class="card tab"></section><section id="quests" class="card tab hidden"></section><section id="shop" class="card tab hidden"></section><section id="family" class="card tab hidden"></section><section id="profile" class="card tab hidden"></section><section id="history" class="card tab hidden"></section>
</section></main>
<script>
const API="https://lsnfspsdzvjkrwrjfvgl.supabase.co/functions/v1/questifamille",BASE=location.origin+location.pathname,invite=new URLSearchParams(location.search).get("invite"),$=id=>document.getElementById(id);
let session=localStorage.getItem("qf_session")||"",state=null,current="home";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
const fmt=d=>d?new Date(d).toLocaleString("fr-FR",{dateStyle:"short",timeStyle:"short"}):"Aucune";
const labels={family_created:"Famille créée",member_joined:"Membre arrivé",member_role_changed:"Rôle modifié",profile_updated:"Profil modifié",quest_created:"Quête créée",quest_updated:"Quête modifiée",quest_deleted:"Quête supprimée",quest_submitted:"Quête terminée",quest_validated:"Quête validée",quest_refused:"Quête refusée",reward_given:"Récompense remise",points_adjusted:"Points modifiés",shop_item_created:"Article boutique ajouté",shop_item_deleted:"Article boutique retiré",shop_item_redeemed:"Récompense boutique demandée",shop_redemption_approved:"Demande boutique approuvée",shop_redemption_given:"Récompense boutique remise",shop_redemption_cancelled:"Demande boutique annulée",invite_created:"Invitation créée",recurring_quest_created:"Quête récurrente créée",recurring_quest_generated:"Quête récurrente générée",recurring_quest_enabled:"Quête récurrente activée",recurring_quest_disabled:"Quête récurrente mise en pause"};
async function api(action,data={}){const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json","x-session-token":session},body:JSON.stringify({action,...data})});const j=await r.json();if(!r.ok)throw new Error(j.error||"Erreur");return j}
function authView(){$("app").classList.add("hidden");$("bell").classList.add("hidden");$("auth").classList.remove("hidden");if(invite){$("auth").innerHTML='<h2>👨‍👩‍👧 Rejoindre une famille</h2><p>Tu as reçu une invitation.</p><input id="jf" placeholder="Prénom"><input id="jl" placeholder="Nom"><button id="join">Rejoindre</button>';$("join").onclick=async()=>{try{let r=await api("join_invite",{invite,first_name:$("jf").value,last_name:$("jl").value});session=r.session_token;localStorage.setItem("qf_session",session);history.replaceState({},document.title,BASE);load()}catch(e){alert(e.message)}}}else{$("auth").innerHTML='<h2>Créer une famille</h2><input id="fn" placeholder="Nom de famille"><input id="pf" placeholder="Prénom du parent"><input id="pl" placeholder="Nom du parent"><button id="create">Créer la famille</button>';$("create").onclick=async()=>{try{let r=await api("create_family",{family_name:$("fn").value,first_name:$("pf").value,last_name:$("pl").value});session=r.session_token;localStorage.setItem("qf_session",session);load()}catch(e){alert(e.message)}}}}
function person(id){return state.members.find(m=>m.person_id===id)}function bal(id){return Number(state.balances?.[id]||0)}
function reward(q){let a=q.reward_type==="money"?"💶 "+Number(q.reward_amount||0).toFixed(2).replace(".",",")+" €":q.reward_type==="none"?"🎯 Aucune":({privilege:"🎮",activity:"🎬",object:"🎁",other:"⭐"}[q.reward_type]||"🎁")+" "+esc(q.reward_text||"Récompense");if(q.points_reward)a+=" · ⭐ "+q.points_reward+" pts";return a}
function render(){
$("auth").classList.add("hidden");$("app").classList.remove("hidden");$("bell").classList.remove("hidden");const manager=["owner","adult"].includes(state.me.role),owner=state.me.role==="owner",unread=state.notifications.filter(n=>!n.read_at).length;$("bellCount").textContent=unread;
const active=state.assignments.filter(a=>["open","submitted"].includes(a.status)).length,validated=state.assignments.filter(a=>a.status==="validated").length,pending=state.assignments.filter(a=>a.status==="validated"&&!a.reward_given).length;
$("home").innerHTML=`<h2>${esc(state.me.avatar_emoji||"🙂")} Bonjour ${esc(state.me.nickname||state.me.first_name)} 👋</h2><p>Famille : <b>${esc(state.family.name)}</b></p><div class="stats"><div class="stat"><b>${active}</b>actives</div><div class="stat"><b>${validated}</b>validées</div><div class="stat"><b>${bal(state.me.id)}</b>points</div><div class="stat"><b>${pending}</b>récompenses</div></div><p><span class="badge">${state.me.role==="owner"?"👑 Créateur / Parent":state.me.role==="adult"?"🧑 Adulte":"👦 Enfant"}</span></p>`;
let qh=state.quests.map(q=>{let ass=state.assignments.filter(a=>a.quest_id===q.id),mine=ass.find(a=>a.person_id===state.me.id),actions="";if(mine&&mine.status==="open")actions+=`<button onclick="submitQ('${q.id}')">✅ J’ai terminé</button>`;if(manager){actions+=`<div class="row"><button class="ghost" onclick="editQ('${q.id}')">✏️ Modifier</button><button class="bad" onclick="deleteQ('${q.id}')">🗑️ Supprimer</button></div>`;actions+=ass.filter(a=>a.status==="submitted").map(a=>`<div class="row"><button class="ok" onclick="reviewQ('${q.id}','${a.person_id}',true)">✔️ Valider ${esc(person(a.person_id)?.first_name||"")}</button><button class="bad" onclick="reviewQ('${q.id}','${a.person_id}',false)">❌ Refuser</button></div>`).join("");actions+=ass.filter(a=>a.status==="validated"&&!a.reward_given&&q.reward_type!=="none").map(a=>`<button onclick="rewardQ('${q.id}','${a.person_id}')">🎁 Récompense remise à ${esc(person(a.person_id)?.first_name||"")}</button>`).join("")}return `<div class="quest"><b>${esc(q.title)}</b> <span class="badge">${q.quest_type==="personal"?"👤 Personnelle":q.quest_type==="general"?"🌍 Générale":"👨‍👩‍👧 Collective"}</span><p>${esc(q.description||"")}</p><small>Limite : ${fmt(q.deadline)} · ${reward(q)}${q.penalty?` · Conséquence : ${esc(q.penalty)}`:""}</small><p>${actions}</p></div>`}).join("");
let rh=(state.recurring||[]).map(r=>`<div class="recurring"><b>🔁 ${esc(r.title)}</b><p><small>${r.frequency==="daily"?"Tous les jours":"Chaque semaine"} · échéance ${esc(r.due_time||"18:00")} · ⭐ ${r.points_reward||0} pts · ${r.active?"active":"en pause"}</small></p>${manager?`<button class="ghost" onclick="toggleRecurring('${r.id}',${!r.active})">${r.active?"⏸️ Mettre en pause":"▶️ Réactiver"}</button>`:""}</div>`).join("");
$("quests").innerHTML='<h2>🎯 Quêtes</h2>'+(manager?'<div class="row"><button id="newq">➕ Nouvelle quête</button><button id="newrq" class="ghost">🔁 Quête répétitive</button></div><div id="qform"></div>':'')+(rh?'<h3>🔁 Quêtes répétitives</h3>'+rh:'')+(manager?'<button id="newq">➕ Nouvelle quête</button><div id="qform"></div>':"")+qh;if(manager){$("newq").onclick=()=>questForm();$("newrq").onclick=()=>recurringForm();}
let items=state.shop.map(i=>`<div class="shopitem"><b>${esc(i.title)}</b><p>${esc(i.description||"")}</p><div class="points">⭐ ${i.points_cost} points</div>${state.me.role==="child"?`<button onclick="redeem('${i.id}')">Prendre</button>`:`<button class="bad" onclick="deleteItem('${i.id}')">Retirer</button>`}</div>`).join("");
let reqs=state.redemptions.map(r=>{let item=state.shop.find(i=>i.id===r.shop_item_id),p=person(r.person_id);return `<div class="redeem"><b>${esc(p?.first_name||"Membre")} · ${esc(item?.title||"Récompense")}</b><br><small>${r.points_spent} pts · ${esc(r.status)}</small>${manager&&r.status!=="given"&&r.status!=="cancelled"?`<div class="row"><button class="ok" onclick="reviewRed('${r.id}','approved')">Approuver</button><button class="gold" onclick="reviewRed('${r.id}','given')">Remise</button><button class="bad" onclick="reviewRed('${r.id}','cancelled')">Annuler</button></div>`:""}</div>`}).join("");
$("shop").innerHTML=`<h2>🛍️ Boutique</h2><p>Solde : <b class="points">⭐ ${bal(state.me.id)} points</b></p>${manager?'<button id="newitem">➕ Ajouter une récompense</button><div id="itemform"></div>':""}<div class="shopgrid">${items||"<p>Aucun article pour le moment.</p>"}</div>${manager?`<h3>Demandes</h3>${reqs||"<p>Aucune demande.</p>"}`:""}`;if(manager)$("newitem").onclick=()=>{$("itemform").innerHTML='<div class="notice"><input id="it" placeholder="Récompense"><textarea id="idc" placeholder="Description"></textarea><input id="ic" type="number" min="1" placeholder="Coût en points"><button id="isave">Ajouter</button></div>';$("isave").onclick=async()=>{try{await api("create_shop_item",{title:$("it").value,description:$("idc").value,points_cost:Number($("ic").value)});load()}catch(e){alert(e.message)}}};
$("family").innerHTML='<h2>👨‍👩‍👧 Famille</h2>'+state.members.map(m=>`<div class="member"><span class="avatar">${esc(m.avatar_emoji||"🙂")}</span><span style="flex:1">${esc(m.nickname||m.first_name+" "+m.last_name)}<br><small>${m.role} · ⭐ ${bal(m.person_id)} pts</small></span>${owner&&m.role!=="owner"?`<select onchange="roleChange('${m.person_id}',this.value)"><option value="child" ${m.role==="child"?"selected":""}>Enfant</option><option value="adult" ${m.role==="adult"?"selected":""}>Adulte</option></select>`:""}${manager&&m.role==="child"?`<button class="ghost" onclick="points('${m.person_id}')">⭐ Points</button>`:""}</div>`).join("")+(owner?'<button id="inviteBtn">🔗 Créer un lien d’invitation</button><div id="inviteOut"></div>':"");if(owner)$("inviteBtn").onclick=async()=>{try{let r=await api("create_invite");$("inviteOut").innerHTML=`<p class="link">${esc(r.link)}</p><button id="copy">📋 Copier</button>`;$("copy").onclick=()=>navigator.clipboard.writeText(r.link)}catch(e){alert(e.message)}};
$("profile").innerHTML=`<h2>🙂 Profil</h2><label>Emoji</label><input id="av" value="${esc(state.me.avatar_emoji||"🙂")}"><label>Surnom</label><input id="nick" value="${esc(state.me.nickname||"")}"><p><small>Nom : ${esc(state.me.first_name+" "+state.me.last_name)}</small></p><button id="saveProfile">Enregistrer</button> <button id="notifyDevice" class="ghost">🔔 Activer les notifications du téléphone</button>`;$("saveProfile").onclick=async()=>{try{await api("update_profile",{nickname:$("nick").value,avatar_emoji:$("av").value});load()}catch(e){alert(e.message)}};$("notifyDevice").onclick=enablePush;
$("history").innerHTML='<h2>📜 Historique</h2>'+state.history.map(h=>`<div class="hist"><b>${esc(labels[h.action]||h.action.replaceAll("_"," "))}</b><br><small>${fmt(h.created_at)}</small>${h.details?.title?`<p>${esc(h.details.title)}</p>`:""}</div>`).join("");show(current);if(unread.length&&Notification.permission==="granted"){let n=state.notifications.find(x=>!x.read_at);try{new Notification(n.title,{body:n.message})}catch{}}
}
function questForm(q=null){let kids=state.members.filter(m=>m.role==="child");$("qform").innerHTML=`<div class="notice"><input id="qt" placeholder="Titre" value="${esc(q?.title||"")}"><textarea id="qd" placeholder="Description">${esc(q?.description||"")}</textarea>${q?"":`<select id="qty"><option value="general">🌍 Générale</option><option value="personal">👤 Personnelle</option><option value="collective">👨‍👩‍👧 Collective</option></select><select id="target"><option value="">Tous les enfants</option>${kids.map(c=>`<option value="${c.person_id}">${esc(c.first_name+" "+c.last_name)}</option>`).join("")}</select><select id="rt"><option value="none">Aucune récompense</option><option value="money">💶 Argent</option><option value="privilege">🎮 Privilège</option><option value="activity">🎬 Activité</option><option value="object">🎁 Objet</option><option value="other">⭐ Autre</option></select><input id="rw" placeholder="Récompense (ex : 30 min de console ou 5)">`}<input id="pts" type="number" min="0" placeholder="Points gagnés" value="${q?.points_reward||0}"><input id="pen" placeholder="Conséquence si non terminée" value="${esc(q?.penalty||"")}"><input id="dead" type="datetime-local"><button id="saveq">${q?"Enregistrer":"Créer"}</button></div>`;if(q&&q.deadline){try{$("dead").value=new Date(q.deadline).toISOString().slice(0,16)}catch{}}$("saveq").onclick=async()=>{try{if(q){await api("edit_quest",{quest_id:q.id,title:$("qt").value,description:$("qd").value,points_reward:Number($("pts").value||0),penalty:$("pen").value,deadline:$("dead").value||null})}else{let rt=$("rt").value,rw=$("rw").value,t=$("target").value;await api("create_quest",{title:$("qt").value,description:$("qd").value,quest_type:$("qty").value,reward_type:rt,reward_text:rt==="money"?"":rw,reward_amount:rt==="money"?Number(rw||0):0,points_reward:Number($("pts").value||0),penalty:$("pen").value,deadline:$("dead").value||null,target_person_id:t||null,target_person_ids:t?[t]:null})}load()}catch(e){alert(e.message)}}}

function recurringForm(){
  let kids=state.members.filter(m=>m.role==="child");
  $("qform").innerHTML=`<div class="notice"><h3>🔁 Nouvelle quête répétitive</h3><input id="rqt" placeholder="Titre"><textarea id="rqd" placeholder="Description"></textarea><select id="rqtarget"><option value="">Tous les enfants</option>${kids.map(c=>`<option value="${c.person_id}">${esc(c.first_name+" "+c.last_name)}</option>`).join("")}</select><select id="rqfreq"><option value="daily">Tous les jours</option><option value="weekly">Chaque semaine</option></select><div id="weekdays" class="hidden"><label><input type="checkbox" value="1"> Lundi</label><label><input type="checkbox" value="2"> Mardi</label><label><input type="checkbox" value="3"> Mercredi</label><label><input type="checkbox" value="4"> Jeudi</label><label><input type="checkbox" value="5"> Vendredi</label><label><input type="checkbox" value="6"> Samedi</label><label><input type="checkbox" value="0"> Dimanche</label></div><input id="rqtime" type="time" value="18:00"><input id="rqpts" type="number" min="0" value="10" placeholder="Points gagnés"><input id="rqpen" placeholder="Conséquence si non terminée"><button id="rqsave">Créer la quête répétitive</button></div>`;
  $("rqfreq").onchange=()=>$("weekdays").classList.toggle("hidden",$("rqfreq").value!=="weekly");
  $("rqsave").onclick=async()=>{try{let target=$("rqtarget").value;let days=[...document.querySelectorAll('#weekdays input:checked')].map(x=>Number(x.value));if($("rqfreq").value==="weekly"&&!days.length)return alert("Choisis au moins un jour.");await api("create_recurring_quest",{title:$("rqt").value,description:$("rqd").value,target_person_ids:target?[target]:[],frequency:$("rqfreq").value,weekdays:days,due_time:$("rqtime").value,points_reward:Number($("rqpts").value||0),penalty:$("rqpen").value});load()}catch(e){alert(e.message)}};
}
window.toggleRecurring=async(id,active)=>{try{await api("toggle_recurring_quest",{template_id:id,active});load()}catch(e){alert(e.message)}};
function b64ToUint8Array(base64){const padding="=".repeat((4-base64.length%4)%4),b64=(base64+padding).replace(/-/g,"+").replace(/_/g,"/");const raw=atob(b64);return Uint8Array.from([...raw].map(c=>c.charCodeAt(0)))}
async function enablePush(){
  try{
    if(!("serviceWorker" in navigator)||!("PushManager" in window)||!("Notification" in window))return alert("Les notifications push ne sont pas compatibles sur ce navigateur.");
    const permission=await Notification.requestPermission();if(permission!=="granted")return alert("Autorisation non accordée.");
    const reg=await navigator.serviceWorker.register("/sw.js");await navigator.serviceWorker.ready;
    let sub=await reg.pushManager.getSubscription();
    if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64ToUint8Array(state.vapid_public_key)});
    const j=sub.toJSON();await api("save_push_subscription",{subscription:{endpoint:sub.endpoint,keys:j.keys}});
    alert("Notifications push activées 👍");
  }catch(e){alert("Impossible d’activer les notifications : "+e.message)}
}

$("bell").onclick=async()=>{current="home";show("home");$("home").insertAdjacentHTML("afterbegin",'<h3>🔔 Notifications</h3>'+state.notifications.map(n=>`<div class="note ${n.read_at?"":"unread"}"><b>${esc(n.title)}</b><p>${esc(n.message)}</p><small>${fmt(n.created_at)}</small></div>`).join(""));try{await api("mark_notifications_read");$("bellCount").textContent="0"}catch{}};
async function load(){if(!session)return authView();try{state=await api("state");render()}catch(e){if(String(e.message).includes("Session")){localStorage.removeItem("qf_session");session="";authView()}else alert(e.message)}}
function show(id){current=id;document.querySelectorAll(".tab").forEach(x=>x.classList.add("hidden"));$(id).classList.remove("hidden");document.querySelectorAll("[data-tab]").forEach(b=>b.classList.toggle("active",b.dataset.tab===id))}
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>show(b.dataset.tab));
window.submitQ=async id=>{try{await api("submit_quest",{quest_id:id});load()}catch(e){alert(e.message)}};window.reviewQ=async(q,p,a)=>{try{await api("review_quest",{quest_id:q,person_id:p,approve:a});load()}catch(e){alert(e.message)}};window.rewardQ=async(q,p)=>{try{await api("reward_given",{quest_id:q,person_id:p});load()}catch(e){alert(e.message)}};window.roleChange=async(p,r)=>{try{await api("change_role",{person_id:p,role:r});load()}catch(e){alert(e.message)}};window.editQ=id=>{show("quests");questForm(state.quests.find(q=>q.id===id))};window.deleteQ=async id=>{if(confirm("Supprimer cette quête ?"))try{await api("delete_quest",{quest_id:id});load()}catch(e){alert(e.message)}};window.points=async p=>{let a=prompt("Combien de points ? Mets un nombre négatif pour retirer.");if(a===null)return;let r=prompt("Raison ?","Bonus parent");try{await api("add_points",{person_id:p,amount:Number(a),reason:r||"Ajustement"});load()}catch(e){alert(e.message)}};window.redeem=async id=>{if(confirm("Utiliser tes points pour cette récompense ?"))try{await api("redeem_shop_item",{item_id:id});load()}catch(e){alert(e.message)}};window.deleteItem=async id=>{if(confirm("Retirer cet article de la boutique ?"))try{await api("delete_shop_item",{item_id:id});load()}catch(e){alert(e.message)}};window.reviewRed=async(id,status)=>{try{await api("review_redemption",{redemption_id:id,status});load()}catch(e){alert(e.message)}};
if("serviceWorker" in navigator){navigator.serviceWorker.register("/sw.js").catch(()=>{})}load();setInterval(()=>{if(session)load()},10000);
</script></body></html>
